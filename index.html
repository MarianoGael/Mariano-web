<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOS ILUMINATIS - NUEVA GENERACIÓN</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at center, #480000 0%, #160000 40%, #000 85%);
    color: white;
    font-family: Georgia, serif;
    overflow-x: hidden;
}

header {
    padding: 22px;
    text-align: center;
    letter-spacing: 6px;
    border-bottom: 1px solid #a00000;
    background: #050000;
    box-shadow: 0 0 20px #b00000;
    font-size: 20px;
}

main {
    min-height: 90vh;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 20px;
}

h1 {
    font-size: clamp(38px, 8vw, 90px);
    font-weight: 900;
    letter-spacing: 5px;
    background: linear-gradient(
      180deg, #fff, #ff5555, #a00000, #ff0000
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px red);
    animation: resplandor 2s infinite alternate;
}

h2 {
    font-size: clamp(22px, 5vw, 45px);
    margin-top: 15px;
    color: #ff3333;
    text-shadow: 0 0 15px red;
    letter-spacing: 5px;
}

@keyframes resplandor {
    from { filter: drop-shadow(0 0 5px #900); }
    to { filter: drop-shadow(0 0 25px red); }
}

.corona {
    font-size: 85px;
    filter: drop-shadow(0 0 20px red);
    margin-bottom: 10px;
}

.adornos {
    font-size: 35px;
    color: #ff2020;
    text-shadow: 0 0 15px red;
    letter-spacing: 15px;
    margin: 25px;
}

.lateral {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: clamp(35px, 6vw, 75px);
    color: #b00000;
    text-shadow: 0 0 20px red;
}

.izquierda { left: 4%; }
.derecha { right: 4%; }

p {
    max-width: 650px;
    color: #ddd;
    font-family: Arial, sans-serif;
    font-size: 18px;
    line-height: 1.8;
    margin-top: 30px;
}

button {
    margin-top: 35px;
    padding: 16px 35px;
    background: #160000;
    color: white;
    border: 2px solid #e00000;
    box-shadow: 0 0 20px red;
    letter-spacing: 3px;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    background: #a00000;
    transform: scale(1.06);
}

#mensaje {
    color: #ff5555;
    margin-top: 20px;
}

footer {
    text-align: center;
    padding: 20px;
    color: #a44;
    border-top: 1px solid #700;
}

@media(max-width: 600px) {
    .lateral { opacity: .35; }
}
</style>
</head>

<body>

<header>
    ✦ LOS ILUMINATIS ✦
</header>

<main>

    <div class="lateral izquierda">😈</div>
    <div class="lateral derecha">👿</div>

    <div class="corona">♛</div>

    <div class="adornos">✦ ⛧ ✦</div>

    <h1>LOS ILUMINATIS</h1>
    <h2>NUEVA GENERACIÓN</h2>

    <div class="adornos">🔥 ✧ 🔥</div>

    <p>
        Bienvenidos a una nueva generación.
        Un espacio de misterio, creatividad,
        personalidad y estilo.
        Una nueva historia comienza aquí.
    </p>

    <button onclick="mostrarMensaje()">
        EXPLORA MÁS →
    </button>

    <div id="mensaje"></div>

</main>

<footer>
    © 2026 LOS ILUMINATIS - NUEVA GENERACIÓN
</footer>

<script>
function mostrarMensaje() {
    document.getElementById("mensaje").textContent =
    "🔥 UNA NUEVA GENERACIÓN COMIENZA 🔥";
}
</script>

</body>
</html>
