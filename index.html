<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vienvenidos</title>
    <style>
 margin-top: 40px;
    cursor: pointer;
    background-color: #00C853;
    color: verde;
    border: border: 2px solid green;
    border-radius: 20px;
}
</style>
</head>
<body>

<h1 style="color: green; text-align: center; font-size: 60px;">EN PROCESO</h1>
<h2>Mi espacio para dibujar</h2>

<canvas id="miLienzo" width="500" height="300"
style="border: 2px solid green; background: white;">
</canvas>
<script>
const lienzo = document.getElementById("miLienzo");
const ctx = lienzo.getContext("2d");

let dibujando = false;

lienzo.addEventListener("mousedown", (e) => {
    dibujando = true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
});

lienzo.addEventListener("mousemove", (e) => {
    if (!dibujando) return;

    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.strokeStyle = "green";
    ctx.lineWidth = 3;
    ctx.stroke();
});

lienzo.addEventListener("mouseup", () => {
    dibujando = false;
});

lienzo.addEventListener("mouseleave", () => {
    dibujando = false;
});
</form>

</body>
</html>
