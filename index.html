<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOS KALAKITOS - PAITA</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #4b0000, #160000 50%, #000 85%);
    color: white;
    font-family: Georgia, serif;
    overflow-x: hidden;
}

main {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px 15px;
    position: relative;
}

h1 {
    font-size: clamp(35px, 8vw, 85px);
    font-weight: 900;
    letter-spacing: 5px;
    background: linear-gradient(
        180deg, white, #ff5555, #d00000, #650000
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 15px red);
    animation: brillo 2s infinite alternate;
}

h2 {
    color: #ff2222;
    font-size: clamp(22px, 5vw, 45px);
    letter-spacing: 7px;
    margin-top: 20px;
    text-shadow: 0 0 20px red;
}

h3 {
    color: white;
    font-size: 28px;
    letter-spacing: 10px;
    margin-top: 18px;
    text-shadow: 0 0 15px red;
}

.corona {
    font-size: 85px;
    color: red;
    filter: drop-shadow(0 0 20px red);
    animation: flotar 3s infinite ease-in-out;
}

.diablo {
    position: fixed;
    font-size: 55px;
    filter: drop-shadow(0 0 15px red);
}

.esquina1 { top: 15px; left: 15px; }
.esquina2 { top: 15px; right: 15px; }
.esquina3 { bottom: 15px; left: 15px; }
.esquina4 { bottom: 15px; right: 15px; }

.laterales {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 800px;
    color: #ff2020;
    font-size: 35px;
    margin: 30px 0;
    text-shadow: 0 0 20px red;
}

.linea {
    width: 80%;
    max-width: 600px;
    height: 3px;
    background: linear-gradient(
        90deg, transparent, red, white, red, transparent
    );
    box-shadow: 0 0 20px red;
    margin: 25px;
}

p {
    font-family: Arial, sans-serif;
    font-size: 18px;
    color: #ddd;
    line-height: 1.8;
}

@keyframes brillo {
    from { filter: drop-shadow(0 0 5px red); }
    to { filter: drop-shadow(0 0 30px red); }
}

@keyframes flotar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

footer {
    padding: 20px;
    color: #bb4444;
    border-top: 1px solid #700;
    text-align: center;
}

@media(max-width: 600px) {
    .diablo { font-size: 35px; }
    .laterales { font-size: 25px; }
}
</style>
</head>

<body>

<div class="diablo esquina1">😈</div>
<div class="diablo esquina2">👿</div>
<div class="diablo esquina3">👿</div>
<div class="diablo esquina4">😈</div>

<main>

    <div class="corona">♛</div>

    <div class="laterales">
        <span>⛓ ✦</span>
        <span>✦ ⛓</span>
    </div>

    <h1>LOS KALAKITOS</h1>

    <h2>NUEVA GENERACIÓN</h2>

    <h3>— PAITA —</h3>

    <div class="linea"></div>

    <p>
        UNA NUEVA GENERACIÓN<br>
        UN NUEVO ESTILO<br>
        UNA NUEVA HISTORIA
    </p>

    <div class="laterales">
        <span>🔥 ✧</span>
        <span>✧ 🔥</span>
    </div>

</main>

<footer>
    © 2026 LOS KALAKITOS - PAITA
</footer>

</body>
</html>
