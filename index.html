<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOS ILUMINATIS - NUEVA GENERACIÓN</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(ellipse at center, #500000 0%, #180000 40%, #000 85%);
    color: white;
    font-family: Georgia, serif;
    overflow-x: hidden;
}

header {
    text-align: center;
    padding: 25px;
    background: #080000;
    border-bottom: 2px solid #a00000;
    box-shadow: 0 0 25px red;
    letter-spacing: 6px;
    font-size: 20px;
}

main {
    min-height: 90vh;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 50px 20px;
}

.crown {
    font-size: 90px;
    color: #ff3333;
    filter: drop-shadow(0 0 20px red);
    animation: flotar 3s infinite ease-in-out;
}

h1 {
    font-size: clamp(38px, 8vw, 90px);
    font-weight: 900;
    letter-spacing: 5px;
    background: linear-gradient(
        180deg,
        #ffffff,
        #ff7777,
        #d00000,
        #650000
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 15px red);
    animation: brillo 2s infinite alternate;
}

h2 {
    margin-top: 20px;
    font-size: clamp(22px, 5vw, 48px);
    color: #ff2525;
    letter-spacing: 6px;
    text-shadow: 0 0 15px red;
}

@keyframes brillo {
    from { filter: drop-shadow(0 0 5px red); }
    to { filter: drop-shadow(0 0 30px red); }
}

@keyframes flotar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

.decoracion {
    color: #ff2222;
    font-size: 38px;
    margin: 25px;
    letter-spacing: 12px;
    text-shadow: 0 0 20px red;
}

.diablo {
    position: fixed;
    font-size: 55px;
    filter: drop-shadow(0 0 15px red);
    z-index: 2;
}

.arriba-izq { top: 15px; left: 15px; }
.arriba-der { top: 15px; right: 15px; }
.abajo-izq { bottom: 15px; left: 15px; }
.abajo-der { bottom: 15px; right: 15px; }

.linea {
    width: 75%;
    max-width: 550px;
    height: 3px;
    margin: 25px;
    background: linear-gradient(
        90deg, transparent, red, white, red, transparent
    );
    box-shadow: 0 0 18px red;
}

p {
    max-width: 650px;
    color: #ddd;
    font-family: Arial, sans-serif;
    font-size: 18px;
    line-height: 1.9;
}

button {
    margin-top: 35px;
    padding: 16px 35px;
    background: #180000;
    border: 2px solid red;
    color: white;
    font-size: 16px;
    letter-spacing: 3px;
    box-shadow: 0 0 20px red;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    background: #a00000;
    transform: scale(1.08);
}

#mensaje {
    color: #ff4444;
    margin-top: 25px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #a44;
    border-top: 1px solid #700;
}

@media(max-width: 600px) {
    .diablo { font-size: 35px; opacity: .7; }
}
</style>
</head>

<body>

<div class="diablo arriba-izq">😈</div>
<div class="diablo arriba-der">😈</div>
<div class="diablo abajo-izq">👿</div>
<div class="diablo abajo-der">👿</div>

<header>
    ✦ LOS ILUMINATIS ✦
</header>

<main>

    <div class="crown">♛</div>

    <div class="decoracion">✦ ⛧ ✦</div>

    <h1>LOS ILUMINATIS</h1>

    <h2>NUEVA GENERACIÓN</h2>

    <div class="linea"></div>

    <p>
        Bienvenidos a una nueva generación.
        Un espacio de misterio, personalidad,
        creatividad y estilo.
        Aquí comienza una nueva historia.
    </p>

    <div class="decoracion">🔥 ✧ 🔥</div>

    <button onclick="mostrarMensaje()">
        DESCUBRIR MÁS
    </button>

    <p id="mensaje"></p>

</main>

<footer>
    © 2026 LOS ILUMINATIS - NUEVA GENERACIÓN
</footer>

<script>
function mostrarMensaje() {
    document.getElementById("mensaje").textContent =
        "🔥 UNA NUEVA GENERACIÓN COMIENZA 🔥";
}
</script>

</body>
</html>
